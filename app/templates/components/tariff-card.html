<article class="tariff-card">
  <header class="tariff-card__header">
    <div>
      <span class="tariff-card__index">{{INDEX}}</span>
      <h2>{{TITLE}}</h2>
    </div>
    <span class="tariff-card__badge">{{BADGE}}</span>
  </header>
  <div class="tariff-card__list" role="list">
    {{ITEMS}}
  </div>
</article>
