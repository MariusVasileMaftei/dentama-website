<article class="doctor-card {{CLASS}}">
  <div class="doctor-card__portrait card-surface">{{PORTRAIT}}</div>
  <div class="doctor-card__content card-surface">
    <header>
      <p class="doctor-card__eyebrow">Echipa DENTAMA</p>
      <h2>{{NAME}}</h2>
      <p class="doctor-card__role">{{ROLE}}</p>
    </header>
    <div class="doctor-card__tags">{{TAGS}}</div>
    <div class="doctor-card__bio">{{BIO}}</div>
    <a class="doctor-card__link" href="{{LINK}}">{{LINK_LABEL}} <span aria-hidden="true">→</span></a>
  </div>
</article>
